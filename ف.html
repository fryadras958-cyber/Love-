<!DOCTYPE html>
<html lang="ku" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>بۆ تاقانەکەم 💞</title>
<style>
*{box-sizing:border-box}
body{margin:0;min-height:100vh;overflow:hidden;display:flex;align-items:center;justify-content:center;
font-family:"Segoe UI",Tahoma,sans-serif;text-align:center;color:#fff;
background:radial-gradient(circle at 20% 10%,#79245e 0,#32133f 35%,#0d071e 100%)}
body:before{content:"";position:fixed;inset:0;background:linear-gradient(120deg,transparent,rgba(255,170,225,.08),transparent);animation:shine 7s infinite}
@keyframes shine{0%,100%{transform:translateX(-100%)}50%{transform:translateX(100%)}}
.particle{position:fixed;color:#ffc1e7;font-size:20px;animation:rise linear infinite;opacity:0}
@keyframes rise{0%{transform:translateY(110vh) rotate(0);opacity:0}15%{opacity:.9}100%{transform:translateY(-20vh) rotate(360deg);opacity:0}}
.container{width:min(92%,560px);position:relative}
.card{padding:42px 25px;border:1px solid rgba(255,211,241,.35);border-radius:34px;
background:rgba(255,255,255,.09);box-shadow:0 0 60px rgba(255,71,181,.22),inset 0 0 35px rgba(255,255,255,.04);
backdrop-filter:blur(16px);animation:enter 1.2s ease}
@keyframes enter{from{opacity:0;transform:translateY(35px) scale(.9)}to{opacity:1;transform:none}}
.kicker{font-size:17px;color:#f6b7dd;letter-spacing:2px}
h1{font-size:clamp(28px,7vw,44px);margin:16px 0;color:#ffe0f2;text-shadow:0 0 22px #f06dbb}
.subtitle{font-size:17px;color:#eec6df;margin-bottom:30px}
button{border:0;border-radius:999px;padding:15px 30px;font-size:18px;font-weight:700;color:#5a1746;
background:linear-gradient(135deg,#ffd4ed,#ff82c8);box-shadow:0 8px 25px rgba(255,100,194,.3);
cursor:pointer;transition:.3s}
button:hover{transform:scale(1.06);box-shadow:0 0 30px #ff82c8}
#message{display:none;margin-top:28px;animation:reveal 1.1s ease}
@keyframes reveal{from{opacity:0;transform:scale(.8)}to{opacity:1;transform:scale(1)}}
.message{font-size:clamp(21px,5.2vw,30px);line-height:2.05;color:#fff5fb;text-shadow:0 0 12px rgba(255,157,218,.6)}
.divider{margin:22px auto;width:90px;color:#ffb8df;font-size:22px}
.note{font-size:14px;color:#e9a8d0;margin-top:22px}
</style>
</head>
<body>
<div class="particle" style="left:8%;animation-duration:11s">♡</div>
<div class="particle" style="left:23%;animation-duration:8s;animation-delay:2s">♥</div>
<div class="particle" style="left:45%;animation-duration:13s;animation-delay:1s">✦</div>
<div class="particle" style="left:67%;animation-duration:9s;animation-delay:4s">♡</div>
<div class="particle" style="left:88%;animation-duration:12s;animation-delay:3s">♥</div>
<div class="container">
  <section class="card">
    <div class="kicker">✧ پەیامێکی تایبەت ✧</div>
    <h1>ئەمە بۆ تاقانەکەمە 💗</h1>
    <div class="subtitle">تەنها بۆ ئەو کەسەی دڵم پێی دەخۆشێت...</div>
    <button onclick="openMessage()">کلیک بکە بۆ سەیرکردنی پەیامەکە 💌</button>
    <div id="message">
      <div class="divider">♡ ✨ ♡</div>
      <div class="message">لە دەقەیەک پێش ئێستاا<br>زۆر زۆر زیاترم خۆشەوێیت<br>کچەبچووکەکەم ❤️</div>
      <div class="note">تۆ هەمیشە تایبەتترین کەسی دڵمی 🤍</div>
    </div>
  </section>
</div>
<script>
function openMessage(){
 document.getElementById('message').style.display='block';
 document.querySelector('button').style.display='none';
}
</script>
</body>
</html>
